<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qualitative Data Coder</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <h1>Qualitative Data Coder</h1>
    <div id="controls">
        <button id="openFolder">Open Folder</button>
        <button id="downloadJson">Download JSON</button>
        <span id="currentFile"></span>
    </div>
    <div id="main">
        <div id="sidebar">
            <div id="fileTree"></div>
        </div>
        <div id="editor">
            <div id="textDisplay" contenteditable="true"></div>
            <div id="codesList"></div>
        </div>
    </div>
    
    <script src="index.js"></script>
</body>
</html>
